# The pit.world network footer is fetched server side from pit.world and
# included into the page with SSI: cached an hour (served stale if pit.world is
# down), 3-second timeout, and any failure includes nothing.
proxy_cache_path /var/cache/nginx/pit levels=1 keys_zone=pit:1m max_size=2m inactive=7d use_temp_path=off;

server {
    listen 3000;
    root /usr/share/nginx/html;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 3s;

    ssi on;
    ssi_silent_errors on;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /_pit/footer {
        internal;
        set $pit_footer "https://pit.world/snippets/footer.html?site=sysops.ceo";
        proxy_pass $pit_footer;
        proxy_set_header Host pit.world;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_cache pit;
        proxy_cache_key pit-footer;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_intercept_errors on;
        error_page 301 302 400 403 404 429 500 502 503 504 = /_pit/empty;
    }

    location = /_pit/empty {
        internal;
        return 204;
    }
}
